services:
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: finvigil-frontend-web
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_ML_API_BASE_URL=http://localhost:8000
    networks:
      - finvigil-network

networks:
  finvigil-network:
    external: true
